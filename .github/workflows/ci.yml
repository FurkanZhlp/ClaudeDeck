name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows stays informational until the Windows port (phase 2) is done.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      # Tests never start Electron; skip the ~100 MB npm binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Packaging smoke test: unpacked x64 app, no installer, nothing published. electron-builder
      # downloads its own Electron zip, so ELECTRON_SKIP_BINARY_DOWNLOAD above does not affect it.
      - name: Package smoke test (Windows x64, unpacked)
        if: runner.os == 'Windows'
        run: pnpm build && pnpm exec electron-builder --win --x64 --dir --publish never

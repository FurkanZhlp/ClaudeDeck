name: Release

# Push a tag `v<version>` matching package.json to build and publish a release:
#   1. check the tag commit is on main, then create (or reuse) a DRAFT GitHub release for the tag,
#   2. build each platform on its own native runner (read-only token) and keep the installers as
#      workflow artifacts,
#   3. upload all installers plus SHA256SUMS to the draft from a single job that holds the write token,
#   4. publish the draft only when every build and the upload succeeded (marked latest only if its
#      version is not older than the current latest release).
# A failed build leaves the draft unpublished, so the in-app update check (releases/latest) never
# sees a half-filled release. Builds are unsigned for now.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    name: create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history so origin/main is available for the ancestry check below. The token is only
      # used during checkout (persist-credentials: false).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check tag commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      # Reuses an existing DRAFT release for the tag (e.g. hand-written notes, or a re-run). A release
      # that is already published is never touched, so its assets cannot be clobbered.
      # Otherwise notes come from the annotated tag message, or are generated from merged PRs/commits.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft -q .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published, refusing to overwrite it"
              exit 1
            fi
            echo "Draft release $TAG already exists, reusing it."
            exit 0
          fi
          version="${TAG#v}"
          type="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.type)"
          if [ "$type" != "tag" ]; then
            gh release create "$TAG" --draft --verify-tag --title "ClaudeDeck $version" --generate-notes
            exit 0
          fi
          # checkout fetches the tag as a lightweight ref, so --notes-from-tag would read the commit
          # message. Read the annotated tag object instead and drop its first line (the title).
          sha="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)"
          gh api "repos/$GH_REPO/git/tags/$sha" --jq .message | sed '1d' | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::Tag $TAG has no release notes after its title line"
            exit 1
          fi
          gh release create "$TAG" --draft --verify-tag --title "ClaudeDeck $version" --notes-file notes.md

  mac-arm64:
    name: build macOS arm64
    needs: draft
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      # Unsigned and not notarized, same as the manual release flow so far.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:mac --arm64 --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-mac-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1

  win:
    name: build Windows ${{ matrix.arch }}
    needs: draft
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          # Native arm64 runner (public repos). If it is ever unavailable, build arm64 on
          # windows-latest instead: node-pty ships win32-arm64 prebuilds, but verify the installer
          # on real arm64 hardware before publishing.
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # One arch per run, so the installer is named claudedeck-<version>-<arch>-setup.exe, which
      # the Windows update check looks for.
      - run: pnpm build:win --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-win-${{ matrix.arch }}
          path: dist/claudedeck-*-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 1

  upload:
    name: upload assets to draft
    needs: [mac-arm64, win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l assets
          gh release upload "$TAG" assets/* --clobber

  publish:
    name: publish release
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only mark as latest when this version is >= the current latest release, so re-running an old
      # tag cannot demote the real latest release.
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          latest_tag="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          latest=true
          if [ -n "$latest_tag" ]; then
            if ! npx --yes semver@7.7.2 -p -r ">=${latest_tag#v}" "$version" >/dev/null; then
              latest=false
            fi
          fi
          echo "Current latest: ${latest_tag:-none}, publishing $TAG with --latest=$latest"
          gh release edit "$TAG" --draft=false --latest="$latest"

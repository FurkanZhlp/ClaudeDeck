appId: com.furkanzhlp.claudedeck
productName: ClaudeDeck
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # Whole package, so Windows' conpty.dll and OpenConsole.exe are unpacked next to pty.node.
  - node_modules/node-pty/**
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc signature. Flipping Electron fuses rewrites the framework binary, which breaks the
  # signature Electron ships with; on Apple Silicon an invalid signature kills the app at launch.
  # Ad-hoc signing re-signs every binary after the fuses are set. No Developer ID yet.
  identity: '-'
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
# Arch comes from the CLI (--x64 / --arm64), one installer per arch; never build both in one run,
# that produces a combined installer whose name has no arch.
win:
  target: nsis
  icon: build/icon.ico
  executableName: ClaudeDeck
nsis:
  oneClick: true
  perMachine: false
  # Contract: src/main/updates/updateChecker.ts WINDOWS_ARTIFACT_NAME (pinned by its test).
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  deleteAppDataOnUninstall: false
  shortcutName: ClaudeDeck
npmRebuild: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # file:// ile asar içinden yükleme için gerekli; app:// protokolüne geçince false yapılabilir.
  grantFileProtocolExtraPrivileges: true
